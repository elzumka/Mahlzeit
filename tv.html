<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahlzeit! – Mittagstisch heute</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;align-items:center;justify-content:center}
.tv-screen{
  position:relative;width:100vw;height:100vh;max-width:177.7778vh;max-height:56.25vw;
  aspect-ratio:16/9;background:#f5eee5 url("digitale-anzeige-vorlage.png") center/100% 100% no-repeat;
  overflow:hidden
}
.layer{position:absolute;inset:0;color:#222;font-family:Arial,Helvetica,sans-serif}

/* Exakt über den sechs linken Platzhaltern der Illustrator-Datei */
.daily{
  position:absolute;left:9.55%;top:23.1%;width:43.4%;height:58.0%;
  display:grid;grid-template-rows:repeat(6,1fr)
}
.dish{
  display:grid;grid-template-columns:7.0% minmax(0,1fr) 16.0%;column-gap:1.15%;
  align-items:start;padding-top:1.0%;min-width:0
}
.dish-icon{
  width:75%;height:auto;aspect-ratio:1/1;object-fit:contain;justify-self:start
}
.dish-main{min-width:0}
.dish-name{
  font-family:"Arial Rounded MT Bold",Arial,sans-serif;font-size:1.66vw;line-height:1;
  font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden
}
.dish-desc{
  margin-top:.20em;font-family:"Source Sans Variable","Century Gothic",Arial,sans-serif;
  font-size:1.02vw;line-height:1.04;text-transform:uppercase;letter-spacing:.045em;white-space:nowrap;overflow:hidden
}
.dish-price{
  font-family:"Arial Rounded MT Bold",Arial,sans-serif;font-size:1.52vw;line-height:1;
  font-weight:800;text-align:right;white-space:nowrap;padding-top:.12em
}
.dish.sold-out{opacity:.45}
.sold-label{
  display:inline-block;margin-top:.15em;padding:.10em .42em;border:1px solid #555;border-radius:99px;
  font-size:.60vw;font-weight:800;letter-spacing:.08em
}

/* Exakte drei rechten Flächen der Illustrator-Datei */
.klassiker-box,.schnitzel-box,.dessert-box{
  position:absolute;left:60.5%;width:33.5%;color:#222
}
.klassiker-box{top:24.2%;height:18.9%;padding:4.1% 3.0% 1%}
.schnitzel-box{top:43.8%;height:17.0%;padding:4.0% 3.0% 1%}
.dessert-box{top:63.8%;height:17.1%;padding:3.8% 3.0% 1%}

.classic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8%;height:100%}
.classic-title{
  display:flex;gap:.18em;font-family:"Source Sans Variable","Century Gothic",Arial,sans-serif;
  font-size:1.06vw;font-weight:700;text-transform:uppercase;line-height:1
}

.classic-title.wugu-kaese{
  font-family:"Source Sans Variable","Century Gothic",Arial,sans-serif;
  font-weight:600;
}
.classic-desc{
  margin-top:.15em;font-family:"Source Sans Variable","Century Gothic",Arial,sans-serif;
  font-size:.93vw;line-height:1.04;text-transform:uppercase
}
.classic-price{
  margin-top:.10em;font-family:"Arial Rounded MT Bold",Arial,sans-serif;
  font-size:1.08vw;font-weight:800;text-align:right
}
.menu-item{display:grid;grid-template-columns:1fr auto;gap:.5em}
.menu-copy{font-family:"Source Sans Variable","Century Gothic",Arial,sans-serif;font-size:1.00vw;line-height:1.12;text-transform:uppercase}
.menu-copy strong{font-family:"Arial Rounded MT Bold",Arial,sans-serif;font-size:1.08vw}
.menu-price{font-family:"Arial Rounded MT Bold",Arial,sans-serif;font-size:1.08vw;font-weight:800;white-space:nowrap}
.dessert-columns{
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);
  grid-auto-flow:column;column-gap:8%;font-family:"Source Sans Variable","Century Gothic",Arial,sans-serif;
  font-size:.88vw;line-height:1.28;text-transform:uppercase;letter-spacing:.045em
}
.dessert-columns div::before{content:"- "}

#message{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#31583d;font-size:1.45vw
}
@media(max-aspect-ratio:16/9){.tv-screen{width:100vw;height:auto}}
@media(min-aspect-ratio:16/9){.tv-screen{width:auto;height:100vh}}

.classic-veggie{
  display:inline-block;
  font-size:1.12em;
  line-height:1;
  transform:translateY(.02em);
  color:#31583d;
}

</style>
</head>
<body>
<main class="tv-screen">
  <div class="layer">
    <div id="message" style="display:none">Mittagstisch wird geladen …</div>
    <section id="daily" class="daily" hidden></section>
    <section id="klassiker" class="klassiker-box" hidden></section>
    <section id="schnitzel" class="schnitzel-box" hidden></section>
    <section id="dessert" class="dessert-box" hidden></section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kpomtfkngyaojimwaosw.supabase.co';
const SUPABASE_KEY='sb_publishable_NhBrxE_DK7laWTa3HG1BvQ_JZeBj5NK';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function esc(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function money(v){
  const n=Number(v);
  return Number.isFinite(n)?n.toFixed(2).replace(".",",")+" €":"";
}
function sold(v){return v===true||v==="true"||v===1||v==="1"}
function todayISO(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

async function ladeTV(){
  const message=document.getElementById("message");
  const daily=document.getElementById("daily");
  const klassiker=document.getElementById("klassiker");
  const schnitzel=document.getElementById("schnitzel");
  const dessert=document.getElementById("dessert");

  const [{data:gerichte,error:gerErr},{data:klassikerData,error:klErr}]=await Promise.all([
    supabaseClient.from("Gerichte").select("*").eq("datum",todayISO()).eq("website_anzeigen",true)
      .order("reihenfolge",{ascending:true,nullsFirst:false}).order("id",{ascending:true}),
    supabaseClient.from("Klassiker").select("*").eq("aktiv",true)
      .order("sortierung",{ascending:true}).order("id",{ascending:true})
  ]);

  if(gerErr){
    console.error("TV Gerichte:",gerErr);
    message.textContent="Tagesgerichte konnten nicht geladen werden.";
    message.style.display="flex";
    return;
  }

  const items=[...(gerichte||[])].sort((a,b)=>sold(a.ausverkauft)-sold(b.ausverkauft));

  const icons={
    veggie:"vegetarian.png"
  };

  function symbol(item){
    return item.vegetarisch ? icons.veggie : "";
  }

  daily.innerHTML=items.slice(0,6).map(item=>{
    const isSold=sold(item.ausverkauft);
    const ico=symbol(item);
    return `<article class="dish ${isSold?"sold-out":""}">
      <div>${ico?`<img class="dish-icon" src="${ico}" alt="" onerror="this.style.display='none'">`:""}</div>
      <div class="dish-main">
        <div class="dish-name">${esc(item.gerichte||"")}</div>
        <div class="dish-desc">${esc(item.beilage||"")}</div>
        ${isSold?'<div class="sold-label">AUSVERKAUFT</div>':""}
      </div>
      <div class="dish-price">${money(item.preis)}</div>
    </article>`;
  }).join("");

  daily.hidden=false;
  message.hidden=true;
  message.style.display="none";

  const c=klassikerData||[];

  const kraut =
    c.find(
      x => /kräuterquark/i.test(x.name||"")
    );

  const wurstgulasch =
    c.find(
      x =>
        /wurstgulasch|wu-?gu/i.test(x.name||"") ||
        /wurstgulasch|wu-?gu/i.test(x.beschreibung||"")
    );

  const schn =
    c.find(
      x => /schnitzel/i.test(x.name||"")
    );

  const wurstBasispreis =
    wurstgulasch?.preis ?? 7.90;

  const wurstKaesePreis =
    wurstgulasch?.preis_mit_kaese ??
    wurstgulasch?.preis_käse ??
    wurstgulasch?.kaese_preis ??
    8.20;

  klassiker.innerHTML=`
    <div class="classic-grid">

      <div>
        ${kraut?`
          <div class="classic-title">
            <span class="classic-veggie">◦</span>
            <span>${esc(kraut.name)}</span>
          </div>
          <div class="classic-desc">
            ${esc(kraut.beschreibung||"")}
          </div>
          <div class="classic-price">
            ${money(kraut.preis)}
          </div>
        `:""}
      </div>

      <div>
        ${wurstgulasch?`
          <div class="classic-title">
            <span>NUDELN</span>
          </div>
          <div class="classic-desc">
            WURSTGULASCH
          </div>
          <div class="classic-price">
            ${money(wurstBasispreis)}
          </div>

          <div class="classic-title wugu-kaese" style="margin-top:.30em">
            <span>WU-GU MIT KÄSE</span>
          </div>
          <div class="classic-price">
            ${money(wurstKaesePreis)}
          </div>
        `:""}
      </div>

    </div>
  `;
  klassiker.hidden=false;

  schnitzel.innerHTML=schn?`
    <div class="menu-item">
      <div class="menu-copy">
        <strong>SCHNITZEL</strong><br>
        MIT ROHKOST ODER DESSERT<br>
        UND GETRÄNK
      </div>
      <div class="menu-price">
        ${money(schn.preis ?? 11.50)}
      </div>
    </div>
  `:"";
  schnitzel.hidden=!schn;

  /* Platzhalter-Inhalte entsprechen der sichtbaren Vorlage und können
     später durch eigene Daten aus der Verwaltung ersetzt werden. */
  dessert.innerHTML=`<div class="dessert-columns">
    <div>Möhren Rohkost</div><div>Weißkraut</div><div>Salat</div><div>Rote Beete</div>
    <div>Schokopudding</div><div>Rote Grütze</div><div>Quarkspeise</div><div>Milchreis</div>
  </div>`;
  dessert.hidden=false;
}

ladeTV();
setInterval(ladeTV,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ladeTV()});
</script>
</body>
</html>
