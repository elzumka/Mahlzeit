  if(!g)return;
  const texts=g.querySelectorAll(":scope > text");
  if(!texts[index])return;
  const el=texts[index];
  const tspans=el.querySelectorAll(":scope > tspan");
  if(tspans.length){
    tspans[0].textContent=String(value??"");
    for(let i=1;i<tspans.length;i++)tspans[i].textContent="";
  }else{
    el.textContent=String(value??"");
  }
}

function setRowVisibility(group,visible){
  const g=document.getElementById(group);
  if(g)g.style.display=visible?"":"none";
}

function setSoldStyle(group,sold){
  const g=document.getElementById(group);
  if(!g)return;
  g.style.opacity=sold?".45":"1";
}

function scaleStage(){
  const stage=document.getElementById("stage");
  const s=Math.min(window.innerWidth/1939.4,window.innerHeight/1108.34);
  stage.style.transform=`scale(${s})`;
}

async function ladeTV(){
  const {data,error}=await supabaseClient
    .from("Gerichte")
    .select("*")
    .eq("datum",todayISO())
    .eq("website_anzeigen",true)
    .order("reihenfolge",{ascending:true,nullsFirst:false})
    .order("id",{ascending:true});

  if(error){
    console.error("TV Gerichte:",error);
    return;
  }

  const items=[...(data||[])].sort(
    (a,b)=>isSold(a.ausverkauft)-isSold(b.ausverkauft)
  );

  for(let i=1;i<=7;i++){
    const item=items[i-1];
    const group=`gericht_${i}`;

    if(!item){
      setRowVisibility(group,false);
      continue;
    }

    setRowVisibility(group,true);
    setSoldStyle(group,isSold(item.ausverkauft));

    setText(group,0,String(item.gerichte||"").toUpperCase());
    setText(group,1,String(item.beilage||"").toUpperCase());

    const price=Number(item.preis);
    setText(
      group,
      2,
      Number.isFinite(price)
        ? price.toFixed(2).replace(".",",")+" €"
        : ""
    );
  }
}

scaleStage();
window.addEventListener("resize",scaleStage);
ladeTV();
setInterval(ladeTV,60000);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)ladeTV();
});
</script>
