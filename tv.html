<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Mahlzeit! – Mittagstisch heute</title>
<style>

  font-family:"ImpactCustom";
  src:url("Impact.ttf") format("truetype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"ArialRoundedCustom";
  src:url("ArialRounded.ttf") format("truetype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"SourceSansCustom";
  src:url("SourceSansVariable.otf") format("opentype");
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"CenturyGothicCustom";

  font-weight:400;
  font-style:normal;
  font-display:swap;
}

  font-family:"CeraCustom";

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;align-items:center;justify-content:center}
.tv-screen{
  position:relative;width:100vw;height:100vh;max-width:177.7778vh;max-height:56.25vw;
  aspect-ratio:16/9;background:#f5eee5 url("digitale-anzeige-vorlage.png") center/100% 100% no-repeat;
  overflow:hidden
}
.layer{position:absolute;inset:0;color:#222;font-family:Arial,Helvetica,sans-serif}

/* Exakt über den sechs linken Platzhaltern der Illustrator-Datei */
.daily{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
}

.dish{
  position:absolute;
  left:0;
  width:100%;
  height:118.6px;
  padding:0;
  display:block;
}

.dish:nth-child(1){top:258.0px}
.dish:nth-child(2){top:376.6px}
.dish:nth-child(3){top:495.1px}
.dish:nth-child(4){top:613.7px}
.dish:nth-child(5){top:732.3px}
.dish:nth-child(6){top:850.9px}

.dish-icon{
  position:absolute;
  left:61px;
  top:-9px;
  width:54px;
  height:54px;
  object-fit:contain;
  opacity:.92;
}

.dish-main{
  position:absolute;
  left:195.9px;
  top:0;
  width:560px;
  min-width:0;
}

.dish-name{
  font-family:"ImpactCustom",Impact,"Arial Black",sans-serif;
  font-size:71.81px;
  line-height:80.7px;
  font-weight:400;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
}

.dish-desc{
  margin-top:-10.3px;
  font-family:"SourceSansCustom","CenturyGothicCustom",Arial,sans-serif;
  font-size:37.80px;
  line-height:40px;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.025em;
  white-space:nowrap;
  overflow:hidden;
}

.dish-price{
  position:absolute;
  left:0;
  top:43.4px;
  width:1038.5px;
  font-family:"ArialRoundedCustom",Arial,sans-serif;
  font-size:42.22px;
  line-height:44px;
  font-weight:700;
  text-align:right;
  white-space:nowrap;
}

.dish.sold-out{opacity:.45}

.sold-label{
  display:inline-block;
  margin-top:1px;
  padding:3px 9px;
  border:1px solid #555;
  border-radius:99px;
  font-family:"Source Sans Variable",Arial,sans-serif;
  font-size:14px;
  line-height:18px;
  font-weight:700;

/* Rechte Bereiche – Koordinaten entsprechend der Nutzer-PDF */

  left:0;
  top:0;
  width:100%;
  height:100%;
  color:#222;
  overflow:hidden;
}

.klassiker-box{padding:0}
.schnitzel-box{padding:0}
.dessert-box{padding:0}

.classic-grid{
  position:relative;
  width:100%;
  height:100%;

.classic-grid > div:nth-child(1){

  top:354.5px;

  line-height:29px;

.classic-desc-price-row{

.classic-desc-price-row .classic-desc{

.classic-desc{

  line-height:29px;
  font-weight:400;

.classic-price{

.classic-veggie-wrap{

  align-items:center;

.classic-veggie{

  height:27px;

.schnitzel-box .menu-item{
  position:absolute;
  left:1193.6px;
  top:579.0px;
  width:305px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:start;
}

.menu-copy{
  font-family:"SourceSansCustom","CenturyGothicCustom",Arial,sans-serif;
  font-size:27.51px;
  line-height:29px;
  text-transform:uppercase;
}

.menu-copy strong{
  font-family:"ArialRoundedCustom",Arial,sans-serif;
  font-size:29.10px;
  line-height:34.5px;
  font-weight:700;
}

.menu-price{
  font-family:"ArialRoundedCustom",Arial,sans-serif;
  font-size:29.10px;
  line-height:34.5px;
  font-weight:700;
  white-space:nowrap;
  align-self:end;
}

.dessert-columns{
  position:absolute;
  left:1174px;
  top:830px;
  width:430px;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(4,auto);
  grid-auto-flow:column;
  column-gap:55px;
  font-family:"SourceSansCustom","CenturyGothicCustom",Arial,sans-serif;
  font-size:27.51px;
  line-height:37px;
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.025em;
}

.dessert-columns div::before{content:"- "}

#message{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#31583d;
  font-size:22px;
  display:none !important;
}
#message{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#31583d;font-size:1.45vw
}
@media(max-aspect-ratio:16/9){.tv-screen{width:100vw;height:auto}}
@media(min-aspect-ratio:16/9){.tv-screen{width:auto;height:100vh}}

.classic-veggie{
  display:inline-block;
  font-size:1.12em;
  line-height:1;
  transform:translateY(.02em);
  color:#31583d;
}


.classic-desc-price-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:.65em;
}

.classic-desc-price-row .classic-desc{
  flex:1 1 auto;
  min-width:0;
  margin-top:.17em;
}

.classic-desc-price-row .classic-inline-price{
  flex:0 0 auto;
  margin-left:auto;
  text-align:right;
}

.wugu-kaese-row{
  margin-top:.20em;
}

.wugu-kaese{
  font-family:"SourceSansCustom","CenturyGothicCustom",Arial,sans-serif !important;
  font-weight:400 !important;
  font-size:1.02vw !important;
}

</style>
</head>
<body>

    <section id="daily" class="daily" hidden></section>

function esc(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function money(v){
  const n=Number(v);
  return Number.isFinite(n)?n.toFixed(2).replace(".",",")+" €":"";
}
function sold(v){return v===true||v==="true"||v===1||v==="1"}
function todayISO(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

async function ladeTV(){
  const message=document.getElementById("message");
  const daily=document.getElementById("daily");
  const klassiker=document.getElementById("klassiker");
  const schnitzel=document.getElementById("schnitzel");
  const dessert=document.getElementById("dessert");

  const [{data:gerichte,error:gerErr},{data:klassikerData,error:klErr}]=await Promise.all([
    supabaseClient.from("Gerichte").select("*").eq("datum",todayISO()).eq("website_anzeigen",true)
      .order("reihenfolge",{ascending:true,nullsFirst:false}).order("id",{ascending:true}),
    supabaseClient.from("Klassiker").select("*").eq("aktiv",true)
      .order("sortierung",{ascending:true}).order("id",{ascending:true})
  ]);

  if(gerErr){
    console.error("TV Gerichte:",gerErr);
    message.textContent="Tagesgerichte konnten nicht geladen werden.";
    message.style.display="flex";
    return;
  }

  const items=[...(gerichte||[])].sort((a,b)=>sold(a.ausverkauft)-sold(b.ausverkauft));

  const icons={
    veggie:"vegetarian.png"
  };

  function symbol(item){
    return item.vegetarisch ? icons.veggie : "";
  }

  daily.innerHTML=items.slice(0,6).map(item=>{
    const isSold=sold(item.ausverkauft);
    const ico=symbol(item);
    return `<article class="dish ${isSold?"sold-out":""}">
      <div>${ico?`<img class="dish-icon" src="${ico}" alt="" onerror="this.style.display='none'">`:""}</div>
      <div class="dish-main">
        <div class="dish-name">${esc(item.gerichte||"")}</div>
        <div class="dish-desc">${esc(item.beilage||"")}</div>
        ${isSold?'<div class="sold-label">AUSVERKAUFT</div>':""}
      </div>
      <div class="dish-price">${money(item.preis)}</div>
    </article>`;
  }).join("");

  daily.hidden=false;
  message.hidden=true;
  message.style.display="none";

  const c=klassikerData||[];

  const kraut =
    c.find(
      x => /kräuterquark/i.test(x.name||"")
    );

  const wurstgulasch =
    c.find(
      x =>
        /wurstgulasch|wu-?gu/i.test(x.name||"") ||
        /wurstgulasch|wu-?gu/i.test(x.beschreibung||"")
    );

  const schn =
    c.find(
      x => /schnitzel/i.test(x.name||"")
    );

  const wurstBasispreis =
    wurstgulasch?.preis ?? 7.90;

  const wurstKaesePreis =
    wurstgulasch?.preis_mit_kaese ??
    wurstgulasch?.preis_käse ??
    wurstgulasch?.kaese_preis ??
    8.20;

  klassiker.innerHTML=`
    <div class="classic-grid">

      <div>
        <div class="classic-title">
          <span class="classic-veggie-wrap">
            <img class="classic-veggie" src="${DATA_VEG}" alt="">
          </span>
          <span>KRÄUTERQUARK</span>
        </div>

        <div class="classic-desc">
          KARTOFFELN,<br>
          LEINÖL, ZWIEBELN
        </div>

        <div class="classic-price" style="position:absolute;left:226px;top:47px">
          ${money(kraut?.preis ?? 6.90)}
        </div>
      </div>

      <div>
        <div class="classic-title">
          <span>NUDELN</span>
        </div>

        <div class="classic-desc-price-row" style="margin-top:0">
          <span class="classic-desc">WURSTGULASCH</span>
          <span class="classic-inline-price">7,90 €</span>
        </div>

        <div class="classic-desc-price-row wugu-kaese-row" style="margin-top:0">
          <span class="classic-desc wugu-kaese">WU-GU MIT KÄSE</span>
          <span class="classic-inline-price">8,20 €</span>
        </div>
      </div>

    </div>
  `;
  klassiker.hidden=false;
  schnitzel.innerHTML=schn?`
    <div class="menu-item">
      <div class="menu-copy">
        <strong>SCHNITZEL</strong><br>
        MIT GETRÄNK<br>
        UND ROHKOST<br>
        ODER DESSERT
      </div>
      <div class="menu-price">
        ${money(schn.preis ?? 11.50)}
      </div>
    </div>
  `:"";
  schnitzel.hidden=!schn;

  /* Platzhalter-Inhalte entsprechen der sichtbaren Vorlage und können
     später durch eigene Daten aus der Verwaltung ersetzt werden. */
  dessert.innerHTML=`
    <div class="dessert-columns">
      <div>MÖHREN ROHKOST</div>
      <div>WEISSKRAUT</div>
      <div>SALAT</div>
      <div>ROTE BEETE</div>
      <div>SCHOKOPUDDING</div>
      <div>ROTE GRÜTZE</div>
      <div>QUARKSPEISE</div>
      <div>MILCHREIS</div>
    </div>
  `;
  dessert.hidden=false;
}

ladeTV();
setInterval(ladeTV,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ladeTV()});
