function esc(v){return String(v??"")}
function sold(v){return v===true||v==="true"||v===1||v==="1"}
function money(v){const n=Number(v);return Number.isFinite(n)?n.toFixed(2).replace(".",",")+" €":""}

function addText(svg,x,y,value,font,size,anchor="start",weight="400",opacity=1){
  const el=document.createElementNS("http://www.w3.org/2000/svg","text");
  el.setAttribute("x",x); el.setAttribute("y",y);
  el.setAttribute("font-family",font); el.setAttribute("font-size",size);
  el.setAttribute("font-weight",weight); el.setAttribute("text-anchor",anchor);
  el.setAttribute("fill","#171714"); el.setAttribute("opacity",opacity);
  el.textContent=value; svg.appendChild(el);
}

function addImage(svg,href,x,y,w,h,opacity=1){
  if(!href)return;
  const el=document.createElementNS("http://www.w3.org/2000/svg","image");
  el.setAttribute("href",href); el.setAttribute("x",x); el.setAttribute("y",y);
  el.setAttribute("width",w); el.setAttribute("height",h); el.setAttribute("opacity",opacity);
  svg.appendChild(el);
}

function drawDaily(items){
  const svg=document.getElementById("overlay");
  const sorted=[...(items||[])].sort((a,b)=>sold(a.ausverkauft)-sold(b.ausverkauft));
  sorted.slice(0,6).forEach((item,i)=>{
    const opacity=sold(item.ausverkauft)?0.42:1;
    addText(svg,195.8735,ROW_Y[i],String(item.gerichte||"").toUpperCase(),FONT.impact,48.5152,"start","400",opacity);
    addText(svg,195.8735,DESC_Y[i],String(item.beilage||"").toUpperCase(),FONT.source,28.3465,"start","400",opacity);
    addText(svg,1038.4954,ROW_Y[i]+10.4165,money(item.preis),FONT.rounded,31.6572,"end","700",opacity);
    if(sold(item.ausverkauft)){
      addText(svg,195.8735,DESC_Y[i]+18,"AUSVERKAUFT",FONT.source,10.5,"start","700",0.62);
    }
  });
}

function scaleScreen(){
  const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  document.getElementById("screen").style.transform=`scale(${s})`;
}

async function loadTV(){
  try{
    await document.fonts.ready;
    const svg=document.getElementById("overlay");
    svg.innerHTML="";
    const datum=(()=>{
      const d=new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    })();

    const {data,error}=await supabaseClient
      .from("Gerichte").select("*").eq("datum",datum).eq("website_anzeigen",true)
      .order("reihenfolge",{ascending:true,nullsFirst:false}).order("id",{ascending:true});

    if(error)throw error;
    drawDaily(data);
    drawRight();
  }catch(e){
    console.error("TV-Speiseplan:",e);
  }
}

scaleScreen();
window.addEventListener("resize",scaleScreen);
loadTV();
setInterval(loadTV,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadTV()});
