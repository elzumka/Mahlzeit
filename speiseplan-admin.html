function zeigeBereich(id,button){document.querySelectorAll('.admin-bereich').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');button.classList.add('active');}

async function gerichtSpeichern(){
    const datum = document.getElementById('datum').value;
    const gericht = document.getElementById('gericht').value.trim();
    const beilage = document.getElementById('beilage').value.trim();
    const preis = document.getElementById('preis').value;
    const vegetarisch = document.getElementById('vegetarisch').checked;
    const websiteAnzeigen = document.getElementById('website_anzeigen').checked;
    const speiseplanAnzeigen = document.getElementById('speiseplan_anzeigen').checked;
    const meldung = document.getElementById('meldung');

    if(!datum || !gericht || !preis){
        meldung.textContent='Bitte Datum, Gericht und Preis ausfüllen.';
        return;
    }

    const {error} = await supabaseClient.from('Gerichte').insert([{
        datum,
        gerichte: gericht,
        beilage,
        preis,
        vegetarisch,
        website_anzeigen: websiteAnzeigen,
        speiseplan_anzeigen: speiseplanAnzeigen
    }]);

    if(error){
        console.error(error);
        meldung.textContent='Fehler beim Speichern. Prüfe, ob die beiden neuen Supabase-Felder vorhanden sind.';
        return;
    }

    meldung.textContent='Gericht wurde gespeichert.';
    document.getElementById('datum').value='';
    document.getElementById('gericht').value='';
    document.getElementById('beilage').value='';
    document.getElementById('preis').value='';
    document.getElementById('vegetarisch').checked=false;
    document.getElementById('website_anzeigen').checked=true;
    document.getElementById('speiseplan_anzeigen').checked=true;
    gerichteLaden();
}

async function gerichteLaden(){
    const liste = document.getElementById('gerichte-liste');
    const heute = new Date().toLocaleDateString('en-CA');

    const { data, error } = await supabaseClient
        .from('Gerichte')
        .select('*')
        .gte('datum', heute)
        .order('datum', { ascending: true })
        .order('gerichte', { ascending: true });

    if (error) {
        console.error(error);
        liste.innerHTML = '<h2>Gespeicherte Gerichte</h2><p>Fehler beim Laden der Gerichte.</p>';
        return;
    }

    liste.innerHTML = '<h2>Gespeicherte Gerichte</h2>';

    if (!data || !data.length) {
        liste.innerHTML += '<p>Keine aktuellen oder zukünftigen Gerichte gespeichert.</p>';
        return;
    }

    data.forEach(gericht => {
        const e = document.createElement('div');
        e.className = 'gericht-eintrag';
        e.innerHTML = `
            <div class="gericht-datum">${datumFormatieren(gericht.datum)}</div>
            <div class="gericht-name">${gericht.gerichte} ${gericht.vegetarisch ? '🌱' : ''}</div>
            <div class="gericht-beilage">${gericht.beilage || ''}</div>
            <div class="gericht-preis">${preisFormatieren(gericht.preis)}</div>
            <button class="loeschen-button" onclick="gerichtLoeschen(${gericht.id},this)">Löschen</button>
        `;
        liste.appendChild(e);
    });
}
function datumFormatieren(datum){const [y,m,d]=datum.split('-').map(Number);const obj=new Date(y,m-1,d);return ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][obj.getDay()]+', '+String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.'+y;}
function preisFormatieren(preis){return Number(preis).toFixed(2).replace('.',',')+' €';}
async function gerichtLoeschen(id,button){if(!confirm('Dieses Gericht wirklich löschen?'))return;const {error}=await supabaseClient.from('Gerichte').delete().eq('id',id);if(error){console.error(error);document.getElementById('meldung').textContent='Fehler beim Löschen.';return;}button.closest('.gericht-eintrag')?.remove();document.getElementById('meldung').textContent='Gericht wurde gelöscht.';}

function sp_esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function sp_text(x,y,t,cls,size,tracking=0,anchor="start",weight="400"){
  return `<text x="${x}" y="${y}" class="${cls}" font-size="${size}" letter-spacing="${tracking/1000}em" text-anchor="${anchor}" font-weight="${weight}">${sp_esc(t)}</text>`;
}
function sp_isoStart(year,week){
  const d=new Date(Date.UTC(year,0,4));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()-day+1+(week-1)*7);
  return d;
}
function sp_fmt(d,year=false){
  return String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0")+"."+(year?d.getUTCFullYear():"");
}
function sp_range(){
  const a=sp_isoStart(spState.year,spState.week),b=new Date(a);
  b.setUTCDate(b.getUTCDate()+4);
  return sp_fmt(a,true)+" - "+sp_fmt(b,true);
}

async function sp_loadFromSupabase(){
  const start=sp_isoStart(spState.year,spState.week);
  const end=new Date(start);end.setUTCDate(end.getUTCDate()+4);
  const from=start.toISOString().slice(0,10),to=end.toISOString().slice(0,10);
  const status=document.getElementById("sp-status");
  status.textContent="Lade Gerichte …";

  const {data,error}=await supabaseClient
    .from("Gerichte")
    .select("*")
    .gte("datum",from)
    .lte("datum",to)
    .eq("speiseplan_anzeigen",true)
    .order("datum",{ascending:true})
    .order("gerichte",{ascending:true});

  if(error){
    console.error(error);
    spState.days=[[],[],[],[],[]];
    status.textContent="Gerichte konnten nicht geladen werden.";
    sp_render();
    return;
  }

  spState.days=[[],[],[],[],[]];
  (data||[]).forEach(g=>{
    const d=new Date(g.datum+"T00:00:00");
    const index=(d.getDay()+6)%7;
    if(index>=0&&index<5&&spState.days[index].length<10){
      spState.days[index].push([
        g.gerichte||"",
        g.beilage||"",
        preisFormatieren(g.preis),
        !!g.vegetarisch,
        g.website_anzeigen!==false,
        g.speiseplan_anzeigen!==false
      ]);
    }
  });

  sp_render();
  status.textContent=`${data?.length||0} Gerichte für KW ${spState.week} geladen.`;
}

function sp_render(){
  const svg=document.getElementById("sp-overlay");
  if(!svg)return;

  const start=sp_isoStart(spState.year,spState.week);
  let s="";

  // Kopfbereich
  s+=sp_text(122,37.2,"KW "+spState.week,"sp-impact",6,38,"middle");
  s+=sp_text(122,48.0,sp_range(),"sp-round",4,10,"middle");

  /*
   * DATUM UNTER DEN WOCHENTAGEN
   * Die Wochentage selbst stammen aus der Originalvorlage.
   * Wir setzen nur die automatisch berechneten Datumswerte darunter.
   * Alle fünf Datumswerte haben dieselbe Mittelachse und denselben
   * vertikalen Abstand zur jeweiligen Tageszeile.
   */
  const dateX = 16.4;
  const dateY = [118.3,156.6,194.9,233.2,271.5];

  for(let di=0; di<5; di++){
    const d = new Date(start);
    d.setUTCDate(d.getUTCDate()+di);
    s+=sp_text(
      dateX,
      dateY[di],
      sp_fmt(d,false),
      "sp-round",
      4,
      10,
      "middle"
    );
  }

  /*
   * TAGESBEREICHE AUS DER ORIGINAL-ILLUSTRATOR-DATEI
   *
   * Die vier gepunkteten Trennlinien kommen ausschließlich aus der
   * Hintergrundvorlage. Wir zeichnen keine neuen Linien.
   *
   * Originalkoordinaten der vier Trennlinien:
   * 125.529 / 163.839 / 202.149 / 240.459 mm
   * => exakt 38.310 mm Abstand.
   *
   * Die Gerichte werden innerhalb dieser echten Bereiche harmonisch
   * zentriert. Dadurch bleibt die Originalgrafik erhalten und die
   * Verteilung reagiert sauber auf 1 bis 10 Gerichte.
   */
  const separators = [125.529, 163.839, 202.149, 240.459];
  const firstDayTop = 88.0;
  const lastDayBottom = 280.0;
  const innerPad = 3.8;

  const dayTop = di => di === 0
    ? firstDayTop
    : separators[di - 1] + innerPad;

  const dayBottom = di => di < separators.length
    ? separators[di] - innerPad
    : lastDayBottom;

  const maxRows = 10;

  spState.days.forEach((items,di)=>{
    const visible=items
      .filter(item=>item[5]!==false)
      .slice(0,maxRows);

    if(!visible.length)return;

    /*
     * Automatische Zeilenhöhe.
     * Je mehr Gerichte vorhanden sind, desto kompakter wird die Gruppe.
     * Bei wenigen Gerichten wird der vorhandene Platz harmonisch genutzt.
     */
    let rowHeight;
    if(visible.length <= 2) rowHeight = 11.0;
    else if(visible.length <= 3) rowHeight = 10.2;
    else if(visible.length <= 4) rowHeight = 9.2;
    else if(visible.length <= 5) rowHeight = 8.25;
    else if(visible.length <= 6) rowHeight = 7.4;
    else if(visible.length <= 7) rowHeight = 6.7;
    else if(visible.length <= 8) rowHeight = 6.1;
    else if(visible.length <= 9) rowHeight = 5.6;
    else rowHeight = 5.2;

    const titleToDescription = 3.35;
    const groupHeight = (visible.length - 1) * rowHeight + titleToDescription;

    /*
     * Harmonische Verteilung:
     * - gleicher Innenabstand zu den Original-Trennlinien
     * - bei wenigen Gerichten mehr Luft
     * - bei vielen Gerichten kompakter
     * - der gesamte Block wird im Tagesfeld vertikal zentriert
     */
    const top = dayTop(di);
    const bottom = dayBottom(di);
    const availableHeight = bottom - top;

    const effectiveHeight = Math.min(groupHeight, availableHeight);
    const startY = top + Math.max(0, (availableHeight - effectiveHeight) / 2);

    visible.forEach((item,ri)=>{
      const y=startY+ri*rowHeight;

      // Vegetarisch-Symbol bleibt unverändert positioniert und skaliert.
      if(item[3]){
        s+=`<image href="${SP_VEGI}"
          x="${38.2-1.353}"
          y="${y-0.2}"
          width="2.706"
          height="3.603"
          preserveAspectRatio="none"/>`;
      }else{
        s+=`<circle cx="38.2" cy="${y+1.8}" r=".42" fill="#171714"/>`;
      }

      // Hauptelemente fett und in Großbuchstaben.
      s+=sp_text(44.5,y,(item[0]||"").toUpperCase(),"sp-round",3.7,3,"start","700");

      // Beschreibung.
      s+=sp_text(44.5,y+3.35,item[1]||"","sp-source",3.5,100);

      // Preis.
      s+=sp_text(133.5,y,item[2]||"","sp-price",3.7,10,"end","700");
    });
  });

  // ===== TÄGLICHE KLASSIKER =====

  // Kräuterquark – Überschrift und Beschreibung ohne unnötige Lücke.
  s+=sp_text(148,105.7,"KRÄUTERQUARK","sp-round",3.7,10,"start","700");
  s+=sp_text(148,111.0,"Kartoffeln, Leinöl,","sp-source",3.5,100);
  s+=sp_text(148,115.2,"Zwiebeln","sp-source",3.5,100);
  s+=sp_text(193,113.2,"6,90 €","sp-price",3.7,10,"end","700");

  // Nudeln
  s+=sp_text(148,125.7,"NUDELN","sp-round",3.7,10,"start","700");
  s+=sp_text(148,130,"Wurstgulasch","sp-source",3.5,100);
  s+=sp_text(193,130,"7,90 €","sp-price",3.7,10,"end","700");
  s+=sp_text(148,133.6,"mit Käse","sp-source",3.5,100);
  s+=sp_text(193,133.6,"8,20 €","sp-price",3.7,10,"end","700");

  // Schnitzel-Menü – Schnitzel wie Kräuterquark, aber in Großbuchstaben.
  s+=sp_text(148,161.5,"SCHNITZEL","sp-round",3.7,10,"start","700");
  s+=sp_text(148,166.5,"mit Getränk","sp-source",3.5,100);
  s+=sp_text(148,171.5,"und Rohkost","sp-source",3.5,100);
  s+=sp_text(148,176.5,"oder Dessert","sp-source",3.5,100);
  s+=sp_text(193,177,"11,50 €","sp-price",3.7,10,"end","700");

  svg.innerHTML=s;
}

function sp_init(){
  const y=document.getElementById("sp-year");
  const w=document.getElementById("sp-week");
  if(!y||!w)return;

  if(!sp_ready){
    const now=new Date();
    for(let j=now.getFullYear();j<=2050;j++){
      y.insertAdjacentHTML("beforeend",`<option value="${j}">${j}</option>`);
    }
    for(let k=1;k<=53;k++){
      w.insertAdjacentHTML("beforeend",`<option value="${k}">KW ${k}</option>`);
    }

    const iso=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
    const day=iso.getUTCDay()||7;
    iso.setUTCDate(iso.getUTCDate()+4-day);
    const ys=iso.getUTCFullYear();
    const ysd=new Date(Date.UTC(ys,0,1));
    const cur=Math.ceil((((iso-ysd)/86400000)+1)/7);

    spState.year=ys;
    spState.week=Math.min(cur+1,53);
    y.value=spState.year;
    w.value=spState.week;

    y.onchange=async()=>{
      spState.year=+y.value;
      await sp_loadFromSupabase();
    };
    w.onchange=async()=>{
      spState.week=+w.value;
      await sp_loadFromSupabase();
    };

    sp_ready=true;
  }

  sp_loadFromSupabase();
}

async function sp_downloadPNG(){
  const sheet=document.querySelector('.sp-sheet');
  const bgEl=sheet?.querySelector('.sp-sheet-bg');
  const svg=sheet?.querySelector('#sp-overlay');
  if(!sheet||!bgEl||!svg){
    alert('Speiseplan konnte nicht exportiert werden.');
    return;
  }

  const WIDTH=2480;
  const HEIGHT=3508;
  const canvas=document.createElement('canvas');
  canvas.width=WIDTH;
  canvas.height=HEIGHT;
  const ctx=canvas.getContext('2d',{alpha:false});

  // 1) Hintergrund IMMER als eigene Image-Instanz laden und vollständig dekodieren.
  //    Damit ist der PNG-Export unabhängig davon, ob das sichtbare <img> gerade
  //    erst aus der sehr großen Base64-Data-URL geladen wurde.
  const bgImage=new Image();
  bgImage.decoding='async';
  const bgSrc=bgEl.getAttribute('src') || bgEl.src;
  bgImage.src=bgSrc;

  try{
    if(typeof bgImage.decode==='function'){
      await bgImage.decode();
    }else if(!bgImage.complete){
      await new Promise((resolve,reject)=>{
        bgImage.onload=resolve;
        bgImage.onerror=reject;
      });
    }
  }catch(e){
    console.error('Hintergrundbild konnte nicht dekodiert werden:',e);
    alert('Das Hintergrundbild konnte für den PNG-Export nicht geladen werden.');
    return;
  }

  // A4-SVG-Koordinaten -> PNG-Pixel
  const sx=WIDTH/210;
  const sy=HEIGHT/297;
  const px=v=>Number(v||0)*sx;
  const py=v=>Number(v||0)*sy;

  // 2) Den ORIGINALEN Plan zuerst vollständig auf das Canvas malen.
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#f7eee4';
  ctx.fillRect(0,0,WIDTH,HEIGHT);
  ctx.drawImage(bgImage,0,0,WIDTH,HEIGHT);

  // 3) Fonts aus der Seite laden, bevor Text gezeichnet wird.
  try{
    await document.fonts.load('400 100px ImpactCustom');
    await document.fonts.load('400 100px ArialRoundedCustom');
    await document.fonts.load('400 100px SourceSansCustom');
    await document.fonts.ready;
  }catch(e){
    console.warn('Font-Laden beim PNG-Export:',e);
  }

  function familyFor(cls){
    if((cls||'').includes('sp-impact')) return 'ImpactCustom';
    if((cls||'').includes('sp-round') || (cls||'').includes('sp-price')) return 'ArialRoundedCustom';
    return 'SourceSansCustom';
  }

  function drawText(el){
    const x=px(el.getAttribute('x'));
    const y=py(el.getAttribute('y'));
    const size=Number(el.getAttribute('font-size')||16);
    const weight=el.getAttribute('font-weight')||'400';
    const cls=el.getAttribute('class')||'';
    const anchor=el.getAttribute('text-anchor')||'start';
    const fill=el.getAttribute('fill') ||
      (cls.includes('sp-impact')||cls.includes('sp-price') ? '#15572f' : '#171714');
    const ls=parseFloat(el.getAttribute('letter-spacing')||'0')*size*sy;

    ctx.font=`${weight} ${size*sy}px "${familyFor(cls)}"`;
    ctx.fillStyle=fill;
    ctx.textBaseline='alphabetic';
    ctx.textAlign='left';

    const value=el.textContent||'';
    if(!ls){
      let xx=x;
      if(anchor==='middle') ctx.textAlign='center';
      else if(anchor==='end') ctx.textAlign='right';
      ctx.fillText(value,xx,y);
      ctx.textAlign='left';
      return;
    }

    const chars=[...value];
    const widths=chars.map(ch=>ctx.measureText(ch).width);
    const total=widths.reduce((a,b)=>a+b,0)+Math.max(0,chars.length-1)*ls;
    let cursor=anchor==='middle' ? x-total/2 : anchor==='end' ? x-total : x;
    for(let i=0;i<chars.length;i++){
      ctx.fillText(chars[i],cursor,y);
      cursor+=widths[i]+ls;
    }
  }

  function drawCircle(el){
    const cx=px(el.getAttribute('cx'));
    const cy=py(el.getAttribute('cy'));
    const r=Number(el.getAttribute('r')||0)*(sx+sy)/2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=el.getAttribute('fill')||'#171714';
    ctx.fill();
  }

  async function drawImageElement(el){
    const href=el.getAttribute('href') ||
      el.getAttributeNS('http://www.w3.org/1999/xlink','href');
    if(!href)return;
    const img=new Image();
    img.decoding='async';
    img.src=href;
    try{
      if(typeof img.decode==='function') await img.decode();
      else if(!img.complete) await new Promise(r=>{img.onload=r;img.onerror=r;});
    }catch(e){return;}
    ctx.drawImage(
      img,
      px(el.getAttribute('x')),
      py(el.getAttribute('y')),
      px(el.getAttribute('width')),
      py(el.getAttribute('height'))
    );
  }

  // SVG-Gruppen rekursiv durchlaufen. Die alte Version hat nur direkte Kinder
  // verarbeitet; dadurch konnten Inhalte in <g>-Elementen fehlen.
  async function drawNode(node){
    const tag=node.tagName?.toLowerCase();
    if(tag==='text') drawText(node);
    else if(tag==='circle') drawCircle(node);
    else if(tag==='image') await drawImageElement(node);
    else if(tag==='g' || tag==='svg'){
      for(const child of node.children) await drawNode(child);
    }
  }

  // 4) Dynamische Inhalte über den Hintergrund legen.
  for(const child of svg.children) await drawNode(child);

  // 5) PNG erzeugen.
  canvas.toBlob(file=>{
    if(!file){
      alert('PNG konnte nicht erzeugt werden.');
      return;
    }
    const url=URL.createObjectURL(file);
    const a=document.createElement('a');
    a.href=url;
    a.download=`Speiseplan-KW-${String(spState.week).padStart(2,'0')}-${spState.year}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  },'image/png');
}
window.addEventListener("DOMContentLoaded",()=>{
  gerichteLaden();
});
