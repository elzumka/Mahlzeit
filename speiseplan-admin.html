<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahlzeit! – Verwaltung · Speiseplan v17 · PNG-Fontfix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--green:#285437;--green-dark:#1d4029;--cream:#f5eee4;--beige:#ddd1bf;--black:#20201d;--line:#b8ad9d;}
*{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--black);font-family:"DM Sans",Arial,sans-serif;padding:38px 20px}
.container{max-width:900px;margin:auto} h1,h2{font-family:"Barlow Condensed",sans-serif;color:var(--green);text-transform:uppercase;letter-spacing:.04em} h1{font-size:60px;line-height:.9;margin:0 0 28px} h2{font-size:34px;margin:0 0 20px}
.admin-tabs{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:8px}.admin-tab{margin:0;padding:12px 20px;border:1px solid var(--line);background:transparent;color:var(--green);font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}.admin-tab.active{background:var(--green);color:var(--cream)}
.admin-bereich{display:none}.admin-bereich.active{display:block}.form,.saved-plans{background:rgba(255,255,255,.55);border:1px solid var(--line);padding:30px;margin-bottom:24px}
label{display:block;margin-top:18px;margin-bottom:7px;font-weight:700}input,select{width:100%;box-sizing:border-box;padding:13px;font-size:16px;border:1px solid #bbb;background:#fff}input[type=checkbox]{width:auto}.checkbox{display:flex;align-items:center;gap:10px}.checkbox input{margin:0}
button.save{margin-top:28px;padding:14px 24px;border:0;background:var(--green);color:var(--cream);font-size:16px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}.save:hover{background:var(--green-dark)}
#meldung,#speiseplan-meldung{margin-top:18px;font-weight:700}.intro{line-height:1.55;color:#555}.plan-info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.plan-info>div{background:var(--cream);border:1px solid var(--line);padding:15px}.plan-info span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#666;margin-bottom:5px}.plan-info strong{color:var(--green)}
#speiseplan-bearbeiten{display:none;background:var(--cream);border:1px solid var(--line);padding:18px;margin-top:18px}
#speiseplan-bearbeiten.active{display:block}

.gericht-datum{font-weight:700;font-size:18px;margin-bottom:8px}.gericht-name{font-size:20px;font-weight:700}.gericht-beilage{margin-top:4px}.gericht-preis{margin-top:8px;font-weight:700}.loeschen-button{margin-top:18px;padding:10px 16px;border:0;background:var(--green);color:white;cursor:pointer}
@media(max-width:650px){h1{font-size:48px}.plan-info{grid-template-columns:1fr}.plan-entry{grid-template-columns:1fr}.plan-entry img{width:100%;max-height:240px}.admin-tabs{overflow-x:auto}}

/* ===== SPEISEPLAN ===== */
#speiseplan-bereich{display:none}
#speiseplan-bereich.active{display:block}
.sp-toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.sp-toolbar .sp-actions{display:flex;gap:8px;flex-wrap:wrap}
.sp-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.sp-controls>div{background:rgba(255,255,255,.55);border:1px solid var(--line);padding:14px}
.sp-controls span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#666;margin-bottom:5px;font-weight:700}
.sp-controls select{margin:0}
.sp-preview{background:#bdb5aa;padding:18px;overflow:auto}
.sp-sheet{position:relative;width:210mm;height:297mm;margin:auto;background:#f7eee4;box-shadow:0 8px 30px #0002;overflow:hidden}
.sp-sheet-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
#sp-overlay{position:absolute;inset:0;width:100%;height:100%}
@font-face{font-family:"ImpactCustom";src:url("./impact.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"ArialRoundedCustom";src:url("./ARLRDBD.TTF") format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"SourceSansCustom";src:url("./SourceSansVariable-Roman.otf") format("opentype");font-weight:100 900;font-style:normal;font-display:block}
.sp-impact{font-family:"ImpactCustom",Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;fill:#15572f}
.sp-round{font-family:"ArialRoundedCustom","Arial Rounded MT Bold",Arial,sans-serif;fill:#171714}
.sp-source{font-family:"SourceSansCustom","Source Sans 3",Arial,sans-serif;fill:#171714}
.sp-price{font-family:"ArialRoundedCustom","Arial Rounded MT Bold",Arial,sans-serif;fill:#15572f;font-weight:700}
.sp-status{margin:8px 0 14px;color:var(--green);font-weight:700}
@media(max-width:650px){h1{font-size:48px}.plan-info{grid-template-columns:1fr}.admin-tabs{overflow-x:auto}.sp-controls{grid-template-columns:1fr}}
@media print{
  .admin-tabs,.sp-toolbar,.sp-controls,.sp-status{display:none!important}
  #speiseplan-bereich{display:block!important}
  .sp-preview{padding:0;background:#fff}
  .sp-sheet{box-shadow:none;margin:0}
  body{padding:0;background:#fff}
  @page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>
<div class="container">
<h1>Mahlzeit! Verwaltung</h1>
<div class="admin-tabs">
<button class="admin-tab active" type="button" onclick="zeigeBereich('gerichte-bereich',this)">Gerichte</button>
<button class="admin-tab" type="button" onclick="zeigeBereich('speiseplan-bereich',this);sp_init()">Speiseplan</button>
</div>

<section id="gerichte-bereich" class="admin-bereich active">
<div class="form">
<h2>Gericht eintragen</h2>
<label for="datum">Datum</label><input type="date" id="datum">
<label for="gericht">Gericht</label><input type="text" id="gericht" placeholder="z. B. Schnitzel">
<label for="beilage">Beilage</label><input type="text" id="beilage" placeholder="z. B. Bratkartoffeln, Bohnen-Pilzrahm">
<label for="preis">Preis</label><input type="number" id="preis" step="0.01" placeholder="z. B. 8.90">
<label class="checkbox"><input type="checkbox" id="vegetarisch"> Vegetarisch</label>
<label class="checkbox"><input type="checkbox" id="website_anzeigen" checked> Auf Website anzeigen</label>
<label class="checkbox"><input type="checkbox" id="speiseplan_anzeigen" checked> Auf Speiseplan drucken</label>
<div class="intro" style="font-size:12px;margin-top:8px">Ein Gericht kann auf der Website erscheinen, ohne auf dem Druck-Speiseplan zu stehen – ideal für Gerichte vom Vortag.</div>
<button class="save" onclick="gerichtSpeichern()">Gericht speichern</button>
<div id="meldung"></div><div id="gerichte-liste"></div>
</div>
</section>

<section id="speiseplan-bereich" class="admin-bereich">
  <div class="sp-toolbar">
    <div>
      <h2 style="margin:0">Speiseplan</h2>
      <div class="intro">Wähle die Kalenderwoche. Die Gerichte werden automatisch aus der zentralen Gerichte-Liste übernommen.</div>
    </div>
    <div class="sp-actions">
      <button type="button" class="save" onclick="window.print()">PDF / Drucken</button>
      <button type="button" class="save" onclick="sp_downloadPNG()">PNG herunterladen</button>
    </div>
  </div>

  <div class="sp-controls">
    <div>
      <span>Jahr</span>
      <select id="sp-year"></select>
    </div>
    <div>
      <span>Kalenderwoche</span>
      <select id="sp-week"></select>
    </div>
  </div>
  <div id="sp-status" class="sp-status"></div>

  <main class="sp-preview">

        meldung.textContent='Bitte Datum, Gericht und Preis ausfüllen.';
        return;
    }

    const {error} = await supabaseClient.from('Gerichte').insert([{
        datum,
        gerichte: gericht,
        beilage,
        preis,
        vegetarisch,
        website_anzeigen: websiteAnzeigen,
        speiseplan_anzeigen: speiseplanAnzeigen
    }]);

    if(error){
        console.error(error);
        meldung.textContent='Fehler beim Speichern. Prüfe, ob die beiden neuen Supabase-Felder vorhanden sind.';
        return;
    }

    meldung.textContent='Gericht wurde gespeichert.';
    document.getElementById('datum').value='';
    document.getElementById('gericht').value='';
    document.getElementById('beilage').value='';
    document.getElementById('preis').value='';
    document.getElementById('vegetarisch').checked=false;
    document.getElementById('website_anzeigen').checked=true;
    document.getElementById('speiseplan_anzeigen').checked=true;
    gerichteLaden();
}

async function gerichteLaden(){
    const liste = document.getElementById('gerichte-liste');
    const heute = new Date().toLocaleDateString('en-CA');

    const { data, error } = await supabaseClient
        .from('Gerichte')
        .select('*')
        .gte('datum', heute)
        .order('datum', { ascending: true })
        .order('gerichte', { ascending: true });

    if (error) {
        console.error(error);
        liste.innerHTML = '<h2>Gespeicherte Gerichte</h2><p>Fehler beim Laden der Gerichte.</p>';
        return;
    }

    liste.innerHTML = '<h2>Gespeicherte Gerichte</h2>';

    if (!data || !data.length) {
        liste.innerHTML += '<p>Keine aktuellen oder zukünftigen Gerichte gespeichert.</p>';
        return;
    }

    data.forEach(gericht => {
        const e = document.createElement('div');
        e.className = 'gericht-eintrag';
        e.innerHTML = `
            <div class="gericht-datum">${datumFormatieren(gericht.datum)}</div>
            <div class="gericht-name">${gericht.gerichte} ${gericht.vegetarisch ? '🌱' : ''}</div>
            <div class="gericht-beilage">${gericht.beilage || ''}</div>
            <div class="gericht-preis">${preisFormatieren(gericht.preis)}</div>
            <button class="loeschen-button" onclick="gerichtLoeschen(${gericht.id},this)">Löschen</button>
        `;
        liste.appendChild(e);
    });
}
function datumFormatieren(datum){const [y,m,d]=datum.split('-').map(Number);const obj=new Date(y,m-1,d);return ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][obj.getDay()]+', '+String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.'+y;}
function preisFormatieren(preis){return Number(preis).toFixed(2).replace('.',',')+' €';}
async function gerichtLoeschen(id,button){if(!confirm('Dieses Gericht wirklich löschen?'))return;const {error}=await supabaseClient.from('Gerichte').delete().eq('id',id);if(error){console.error(error);document.getElementById('meldung').textContent='Fehler beim Löschen.';return;}button.closest('.gericht-eintrag')?.remove();document.getElementById('meldung').textContent='Gericht wurde gelöscht.';}

function sp_esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function sp_text(x,y,t,cls,size,tracking=0,anchor="start",weight="400"){
  return `<text x="${x}" y="${y}" class="${cls}" font-size="${size}" letter-spacing="${tracking/1000}em" text-anchor="${anchor}" font-weight="${weight}">${sp_esc(t)}</text>`;

function sp_isoStart(year,week){
  const d=new Date(Date.UTC(year,0,4));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()-day+1+(week-1)*7);
  return d;
}
function sp_fmt(d,year=false){
  return String(d.getUTCDate()).padStart(2,"0")+"."+String(d.getUTCMonth()+1).padStart(2,"0")+"."+(year?d.getUTCFullYear():"");
}
function sp_range(){
  const a=sp_isoStart(spState.year,spState.week),b=new Date(a);
  b.setUTCDate(b.getUTCDate()+4);
  return sp_fmt(a,true)+" - "+sp_fmt(b,true);
}

async function sp_loadFromSupabase(){
  const start=sp_isoStart(spState.year,spState.week);
  const end=new Date(start);end.setUTCDate(end.getUTCDate()+4);
  const from=start.toISOString().slice(0,10),to=end.toISOString().slice(0,10);
  const status=document.getElementById("sp-status");
  status.textContent="Lade Gerichte …";

  const {data,error}=await supabaseClient
    .from("Gerichte")
    .select("*")
    .gte("datum",from)
    .lte("datum",to)
    .eq("speiseplan_anzeigen",true)
    .order("datum",{ascending:true})
    .order("gerichte",{ascending:true});

  if(error){
    console.error(error);
    spState.days=[[],[],[],[],[]];
    status.textContent="Gerichte konnten nicht geladen werden.";
    sp_render();
    return;
  }

  spState.days=[[],[],[],[],[]];
  (data||[]).forEach(g=>{
    const d=new Date(g.datum+"T00:00:00");
    const index=(d.getDay()+6)%7;
    if(index>=0&&index<5&&spState.days[index].length<10){
      spState.days[index].push([
        g.gerichte||"",
        g.beilage||"",
        preisFormatieren(g.preis),
        !!g.vegetarisch,
        g.website_anzeigen!==false,
        g.speiseplan_anzeigen!==false
      ]);
    }
  });

  sp_render();
  status.textContent=`${data?.length||0} Gerichte für KW ${spState.week} geladen.`;
}

function sp_render(){
  const svg=document.getElementById("sp-overlay");
  if(!svg)return;

  const start=sp_isoStart(spState.year,spState.week);
  let s="";

  // Kopfbereich
  s+=sp_text(122,37.2,"KW "+spState.week,"sp-impact",6,38,"middle");
  s+=sp_text(122,48.0,sp_range(),"sp-round",4,10,"middle");

  // Die ursprünglichen vertikalen Anker bleiben erhalten.
  // Nur die Gerichte innerhalb der Bereiche werden dynamisch verteilt.
  const firstY = [90.0,136.3,171.3,216.7,251.7];

  // Ende eines Tagesbereichs: vor dem nächsten Tagesblock.
  const dayBottom = [128.5,163.5,204.0,244.0,280.0];

  const maxRows = 10;

  spState.days.forEach((items,di)=>{
    const visible=items
      .filter(item=>item[5]!==false)
      .slice(0,maxRows);

    if(!visible.length)return;

    /*
     * Automatische Zeilenhöhe.
     * Je mehr Gerichte vorhanden sind, desto kompakter wird die Gruppe.
     * Bei wenigen Gerichten wird der vorhandene Platz harmonisch genutzt.
     */
    let rowHeight;
    if(visible.length <= 2) rowHeight = 11.0;
    else if(visible.length <= 3) rowHeight = 10.2;
    else if(visible.length <= 4) rowHeight = 9.2;
    else if(visible.length <= 5) rowHeight = 8.25;
    else if(visible.length <= 6) rowHeight = 7.4;
    else if(visible.length <= 7) rowHeight = 6.7;
    else if(visible.length <= 8) rowHeight = 6.1;
    else if(visible.length <= 9) rowHeight = 5.6;
    else rowHeight = 5.2;

    const titleToDescription = 3.35;
    const groupHeight = (visible.length - 1) * rowHeight + titleToDescription;

    /*
     * Gerichtsliste im verfügbaren Tagesbereich vertikal zentrieren.
     * Der Bereich beginnt beim bisherigen firstY und endet vor der
     * nächsten Trennlinie / dem nächsten Tag.
     */
    const top = firstY[di];
    const bottom = dayBottom[di];
    const availableHeight = bottom - top;

    const startY = groupHeight < availableHeight
      ? top + (availableHeight - groupHeight) / 2
      : top;

    visible.forEach((item,ri)=>{
      const y=startY+ri*rowHeight;

      // Vegetarisch-Symbol bleibt unverändert positioniert und skaliert.
      if(item[3]){
        s+=`<image href="${SP_VEGI}"
          x="${38.2-1.353}"
          y="${y-0.2}"
          width="2.706"
          height="3.603"
          preserveAspectRatio="none"/>`;
      }else{
        s+=`<circle cx="38.2" cy="${y+1.8}" r=".42" fill="#171714"/>`;
      }

      // Hauptelemente fett und in Großbuchstaben.
      s+=sp_text(44.5,y,(item[0]||"").toUpperCase(),"sp-round",3.7,3,"start","700");

      // Beschreibung.
      s+=sp_text(44.5,y+3.35,item[1]||"","sp-source",3.5,100);

      // Preis.
      s+=sp_text(133.5,y,item[2]||"","sp-price",3.7,10,"end","700");
    });
  });

  // ===== TÄGLICHE KLASSIKER =====

  // Kräuterquark – Überschrift und Beschreibung ohne unnötige Lücke.
  s+=sp_text(148,105.7,"KRÄUTERQUARK","sp-round",3.7,10,"start","700");
  s+=sp_text(148,111.0,"Kartoffeln, Leinöl,","sp-source",3.5,100);
  s+=sp_text(148,115.2,"Zwiebeln","sp-source",3.5,100);
  s+=sp_text(193,113.2,"6,90 €","sp-price",3.7,10,"end","700");

  // Nudeln
  s+=sp_text(148,125.7,"NUDELN","sp-round",3.7,10,"start","700");
  s+=sp_text(148,130,"Wurstgulasch","sp-source",3.5,100);
  s+=sp_text(193,130,"7,90 €","sp-price",3.7,10,"end","700");
  s+=sp_text(148,133.6,"mit Käse","sp-source",3.5,100);
  s+=sp_text(193,133.6,"8,20 €","sp-price",3.7,10,"end","700");

  // Schnitzel-Menü – Schnitzel wie Kräuterquark, aber in Großbuchstaben.
  s+=sp_text(148,161.5,"SCHNITZEL","sp-round",3.7,10,"start","700");
  s+=sp_text(148,166.5,"mit Getränk","sp-source",3.5,100);
  s+=sp_text(148,171.5,"und Rohkost","sp-source",3.5,100);
  s+=sp_text(148,176.5,"oder Dessert","sp-source",3.5,100);
  s+=sp_text(193,177,"11,50 €","sp-price",3.7,10,"end","700");

  svg.innerHTML=s;
}

function sp_init(){
  const y=document.getElementById("sp-year");
  const w=document.getElementById("sp-week");
  if(!y||!w)return;

  if(!sp_ready){
    const now=new Date();
    for(let j=now.getFullYear();j<=2050;j++){
      y.insertAdjacentHTML("beforeend",`<option value="${j}">${j}</option>`);
    }
    for(let k=1;k<=53;k++){
      w.insertAdjacentHTML("beforeend",`<option value="${k}">KW ${k}</option>`);
    }

    const iso=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
    const day=iso.getUTCDay()||7;
    iso.setUTCDate(iso.getUTCDate()+4-day);
    const ys=iso.getUTCFullYear();
    const ysd=new Date(Date.UTC(ys,0,1));
    const cur=Math.ceil((((iso-ysd)/86400000)+1)/7);

    spState.year=ys;
    spState.week=Math.min(cur+1,53);
    y.value=spState.year;
    w.value=spState.week;

    y.onchange=async()=>{
      spState.year=+y.value;
      await sp_loadFromSupabase();
    };
    w.onchange=async()=>{
      spState.week=+w.value;
      await sp_loadFromSupabase();
    };

    sp_ready=true;
  }

  sp_loadFromSupabase();
}

async function sp_downloadPNG(){
  const sheet=document.querySelector('.sp-sheet');
  const bgEl=sheet?.querySelector('.sp-sheet-bg');
  const svg=sheet?.querySelector('#sp-overlay');
  if(!sheet||!bgEl||!svg){
    alert('Speiseplan konnte nicht exportiert werden.');
    return;
  }

  const WIDTH=2480;
  const HEIGHT=3508;
  const canvas=document.createElement('canvas');
  canvas.width=WIDTH;
  canvas.height=HEIGHT;
  const ctx=canvas.getContext('2d',{alpha:false});

  // 1) Hintergrund IMMER als eigene Image-Instanz laden und vollständig dekodieren.
  //    Damit ist der PNG-Export unabhängig davon, ob das sichtbare <img> gerade
  //    erst aus der sehr großen Base64-Data-URL geladen wurde.
  const bgImage=new Image();
  bgImage.decoding='async';
  const bgSrc=bgEl.getAttribute('src') || bgEl.src;
  bgImage.src=bgSrc;

  try{
    if(typeof bgImage.decode==='function'){
      await bgImage.decode();
    }else if(!bgImage.complete){
      await new Promise((resolve,reject)=>{
        bgImage.onload=resolve;
        bgImage.onerror=reject;
      });
    }
  }catch(e){
    console.error('Hintergrundbild konnte nicht dekodiert werden:',e);
    alert('Das Hintergrundbild konnte für den PNG-Export nicht geladen werden.');
    return;
  }

  // A4-SVG-Koordinaten -> PNG-Pixel
  const sx=WIDTH/210;
  const sy=HEIGHT/297;
  const px=v=>Number(v||0)*sx;
  const py=v=>Number(v||0)*sy;

  // 2) Den ORIGINALEN Plan zuerst vollständig auf das Canvas malen.
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#f7eee4';
  ctx.fillRect(0,0,WIDTH,HEIGHT);
  ctx.drawImage(bgImage,0,0,WIDTH,HEIGHT);

  // 3) Fonts aus der Seite laden, bevor Text gezeichnet wird.
  try{
    await document.fonts.load('400 100px ImpactCustom');
    await document.fonts.load('400 100px ArialRoundedCustom');
    await document.fonts.load('400 100px SourceSansCustom');
    await document.fonts.ready;
  }catch(e){
    console.warn('Font-Laden beim PNG-Export:',e);
  }

  function familyFor(cls){
    if((cls||'').includes('sp-impact')) return 'ImpactCustom';
    if((cls||'').includes('sp-round') || (cls||'').includes('sp-price')) return 'ArialRoundedCustom';
    return 'SourceSansCustom';
  }

  function drawText(el){
    const x=px(el.getAttribute('x'));
    const y=py(el.getAttribute('y'));
    const size=Number(el.getAttribute('font-size')||16);
    const weight=el.getAttribute('font-weight')||'400';
    const cls=el.getAttribute('class')||'';
    const anchor=el.getAttribute('text-anchor')||'start';
    const fill=el.getAttribute('fill') ||
      (cls.includes('sp-impact')||cls.includes('sp-price') ? '#15572f' : '#171714');
    const ls=parseFloat(el.getAttribute('letter-spacing')||'0')*size*sy;

    ctx.font=`${weight} ${size*sy}px "${familyFor(cls)}"`;
    ctx.fillStyle=fill;
    ctx.textBaseline='alphabetic';
    ctx.textAlign='left';

    const value=el.textContent||'';
    if(!ls){
      let xx=x;
      if(anchor==='middle') ctx.textAlign='center';
      else if(anchor==='end') ctx.textAlign='right';
      ctx.fillText(value,xx,y);
      ctx.textAlign='left';
      return;
    }

    const chars=[...value];
    const widths=chars.map(ch=>ctx.measureText(ch).width);
    const total=widths.reduce((a,b)=>a+b,0)+Math.max(0,chars.length-1)*ls;
    let cursor=anchor==='middle' ? x-total/2 : anchor==='end' ? x-total : x;
    for(let i=0;i<chars.length;i++){
      ctx.fillText(chars[i],cursor,y);
      cursor+=widths[i]+ls;
    }
  }

  function drawCircle(el){
    const cx=px(el.getAttribute('cx'));
    const cy=py(el.getAttribute('cy'));
    const r=Number(el.getAttribute('r')||0)*(sx+sy)/2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=el.getAttribute('fill')||'#171714';
    ctx.fill();
  }

  async function drawImageElement(el){
    const href=el.getAttribute('href') ||
      el.getAttributeNS('http://www.w3.org/1999/xlink','href');
    if(!href)return;
    const img=new Image();
    img.decoding='async';
    img.src=href;
    try{
      if(typeof img.decode==='function') await img.decode();
      else if(!img.complete) await new Promise(r=>{img.onload=r;img.onerror=r;});
    }catch(e){return;}
    ctx.drawImage(
      img,
      px(el.getAttribute('x')),
      py(el.getAttribute('y')),
      px(el.getAttribute('width')),
      py(el.getAttribute('height'))
    );
  }

  // SVG-Gruppen rekursiv durchlaufen. Die alte Version hat nur direkte Kinder
  // verarbeitet; dadurch konnten Inhalte in <g>-Elementen fehlen.
  async function drawNode(node){
    const tag=node.tagName?.toLowerCase();
    if(tag==='text') drawText(node);
    else if(tag==='circle') drawCircle(node);
    else if(tag==='image') await drawImageElement(node);
    else if(tag==='g' || tag==='svg'){
      for(const child of node.children) await drawNode(child);
    }
  }

  // 4) Dynamische Inhalte über den Hintergrund legen.
  for(const child of svg.children) await drawNode(child);

  // 5) PNG erzeugen.
  canvas.toBlob(file=>{
    if(!file){
      alert('PNG konnte nicht erzeugt werden.');
      return;
    }
    const url=URL.createObjectURL(file);
    const a=document.createElement('a');
    a.href=url;
    a.download=`Speiseplan-KW-${String(spState.week).padStart(2,'0')}-${spState.year}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  },'image/png');
}

  gerichteLaden();
